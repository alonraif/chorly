# Production stack. Copy .env.example to .env, fill it in, then: docker compose up -d --build
name: chorly

x-app-env: &app-env
  DATABASE_URL: postgresql://chorly:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/chorly
  NODE_ENV: production
  TZ: ${TIMEZONE:-Asia/Jerusalem}
  TIMEZONE: ${TIMEZONE:-Asia/Jerusalem}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: mailto:${ACME_EMAIL:-admin@example.com}
  FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}

# The app containers: not root, no extra kernel capabilities, nothing writable but /tmp and their volumes.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chorly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chorly
    volumes:
      - chorly_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chorly -d chorly"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Proofs written by older images belong to root; the app now runs as the node user.
  volume-perms:
    build: .
    image: chorly-app:latest
    user: root
    command: chown -R node:node /data/proofs
    volumes:
      - chorly_proofs:/data/proofs
    restart: "no"

  api:
    <<: *hardened
    build: .
    image: chorly-app:latest
    restart: unless-stopped
    working_dir: /app/apps/api
    command: sh -c "node_modules/.bin/prisma migrate deploy && node dist/main.js"
    environment:
      <<: *app-env
      PORT: 4000
      PROOFS_DIR: /data/proofs
      APK_DIR: /data/apk
    volumes:
      - chorly_proofs:/data/proofs
      - ./deploy/apk:/data/apk:ro
    depends_on:
      postgres:
        condition: service_healthy
      volume-perms:
        condition: service_completed_successfully

  web:
    <<: *hardened
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    build: .
    image: chorly-app:latest
    restart: unless-stopped
    working_dir: /app/apps/web
    command: ["node_modules/.bin/next", "start", "-p", "3000"]
    environment:
      NODE_ENV: production
    depends_on:
      - api

  worker:
    <<: *hardened
    build: .
    image: chorly-app:latest
    restart: unless-stopped
    working_dir: /app/apps/worker
    command: ["node_modules/.bin/tsx", "src/scheduler.ts"]
    environment:
      <<: *app-env
      APP_BASE_URL: https://${DOMAIN}
    depends_on:
      - api

  caddy:
    image: caddy:2
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  # Keeps the DNS A record pointed at this network's public IP. Config: deploy/ddns/config.json
  ddns:
    image: qmcgaw/ddns-updater:v2
    restart: unless-stopped
    environment:
      PERIOD: 5m
      TZ: ${TIMEZONE:-Asia/Jerusalem}
    volumes:
      - ./deploy/ddns:/updater/data
    profiles: ["ddns"]

  # Keeps the chores board up on a Nest Hub during the day (opt-in profile). Settings: "Kitchen display" in the README.
  cast:
    build: ./deploy/cast
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Jerusalem}
      HUB_IP: ${HUB_IP:-}
      DISPLAY_URL: ${DISPLAY_URL:-}
      CAST_FROM: ${CAST_FROM:-07:00}
      CAST_UNTIL: ${CAST_UNTIL:-21:00}
    profiles: ["cast"]

  # Nightly pg_dump into ./backups, keeping 14 days. A dump is kept only once it's known good, and old
  # ones are pruned only after a good one, so a failing pg_dump can't leave empty "backups" behind.
  # Owner-only: the dumps hold password hashes and location history.
  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - bash
      - -c
      - |
        set -o pipefail
        umask 077
        chmod 600 /backups/chorly-*.sql.gz 2>/dev/null
        while true; do
          file=/backups/chorly-$$(date +%F).sql.gz
          if pg_dump -h postgres -U chorly chorly | gzip > "$$file.tmp" \
            && gzip -t "$$file.tmp" \
            && gzip -cd "$$file.tmp" | tail -n 20 | grep -q 'PostgreSQL database dump complete'; then
            mv "$$file.tmp" "$$file"
            find /backups -name 'chorly-*.sql.gz' -mtime +14 -delete
            echo "backup ok: $$file"
          else
            rm -f "$$file.tmp"
            echo "backup FAILED, keeping the previous ones" >&2
          fi
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  chorly_pg:
  chorly_proofs:
  caddy_data:
  caddy_config:
